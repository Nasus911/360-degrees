<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d211c" />
    <title>360 Degrees Specialty Cafe - Lipa Branch | Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-role="admin" data-default-page="overview">
    <div class="app" id="app">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">360</div><div><strong>360 Degrees Specialty Cafe</strong><small>Lipa Branch</small></div></div>
        <div class="role-switch">
          <label for="role-select">Workspace</label>
          <select id="role-select" data-role-select>
            <option value="admin" selected>Admin</option>
            <option value="staff">Barista / Cashier</option>
            <option value="customer">Customer</option>
          </select>
        </div>
        <div class="nav-label">Admin workspace</div>
        <nav class="nav" aria-label="Admin navigation">
          <button class="active" data-page="overview" aria-current="page"><span class="nav-icon">⌂</span>Overview</button>
          <button data-page="inventory"><span class="nav-icon">▦</span>Inventory</button>
          <button data-page="products"><span class="nav-icon">☕</span>Products</button>
          <button data-page="promotions"><span class="nav-icon">✳</span>Promotions</button>
          <button data-page="employees"><span class="nav-icon">♙</span>Employees</button>
          <button data-page="reports"><span class="nav-icon">▤</span>Reports</button>
        </nav>
        <div class="sidebar-foot">
          <div class="store">Lipa Branch · Lipa City<small>Open today until 10:00 PM</small></div>
          <div class="person"><div class="avatar">MS</div><div><strong>Mara Santos</strong><small>Operations admin</small></div></div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumb">360 Degrees Specialty Cafe <span class="muted">/</span> <span id="breadcrumb-page">Overview</span></div>
          <div class="top-actions"><span class="location">⌖ &nbsp;Lipa Branch · Lipa City</span><button class="icon-button" aria-label="Notifications" data-action="notifications">♧</button></div>
        </header>
        <section class="content" id="content-view" aria-live="polite"></section>
      </main>
      <nav class="mobile-nav" aria-label="Admin mobile navigation">
        <button class="active" data-page="overview" aria-current="page"><span>⌂</span>Overview</button>
        <button data-page="inventory"><span>▦</span>Inventory</button>
        <button data-page="products"><span>☕</span>Products</button>
        <button data-page="promotions"><span>✳</span>Promotions</button>
        <button data-page="employees"><span>♙</span>Employees</button>
        <button data-page="reports"><span>▤</span>Reports</button>
      </nav>
      <div id="overlay-root"></div>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
